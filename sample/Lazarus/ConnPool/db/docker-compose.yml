# PostgreSQL for Badger ConnPool sample (multi-connection friendly).
# Start:
#   docker compose up -d
# Apply schema:
#   docker compose exec db psql -U badger -d badger_pool -f /docker-entrypoint-initdb.d/01_schema.sql
#   (schema is also loaded automatically on first container create)

services:
  db:
    image: postgres:16-alpine
    container_name: badger-connpool-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: badger_pool
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=128MB
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - badger_connpool_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d badger_pool"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  badger_connpool_pgdata:
